plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = 'create-airwaves-reconstructed'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
}

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    // Development-only mods placed in libs/. They are available to runClient
    // but never copied into the reconstructed Airwaves artifact.
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
}

dependencies {
    // Create publishes its development API as separate Maven artifacts; the
    // copied runtime JAR alone is not sufficient for compilation.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    implementation("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // These JARs are local development dependencies. They are deliberately
    // ignored by Git and are not bundled into the produced Airwaves JAR.
    implementation(files(fileTree(dir: 'libs', include: ['*.jar'])))
    localRuntime(files(fileTree(dir: 'libs', include: ['*.jar'])))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : 'Create: Airwaves',
            'Specification-Version' : project.version,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
        ])
    }
}
